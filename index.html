<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ask Bisi</title>
  <link rel="icon" type="image/png" href="cca-logo.png"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <div class="mic-wrapper">
      <button id="startBtn" class="mic-button" aria-label="Ask Bisi" aria-pressed="false">
        <span class="glow-core" aria-hidden="true">
          <video class="globe-video" autoplay loop muted playsinline aria-hidden="true">
            <source src="/bisisloop.mp4" type="video/mp4"/>
          </video>
          <svg class="globe" viewBox="0 0 100 100" focusable="false">
            <defs>
              <radialGradient id="globe-fill" cx="34%" cy="28%" r="75%">
                <stop offset="0" stop-color="#5fe4ff"/>
                <stop offset="0.34" stop-color="#168cff"/>
                <stop offset="0.72" stop-color="#0754c7"/>
                <stop offset="1" stop-color="#062866"/>
              </radialGradient>
              <linearGradient id="continent-fill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#d9fbff"/>
                <stop offset="1" stop-color="#72d7ff"/>
              </radialGradient>
              <clipPath id="globe-clip">
                <circle cx="50" cy="50" r="44"/>
              </clipPath>
            </defs>
            <circle class="globe-sphere" cx="50" cy="50" r="44"/>
            <g class="globe-continents" clip-path="url(#globe-clip)">
              <path d="m15 31 4-7 8-4 5 2 3 6-4 3-1 5-5 2-2 6-5-2-2-5-5-2 1-4-4-1zm17 17 5 2 3 6-2 4 4 5-2 6-4 8-4-3-1-8-4-6 2-7-3-3z"/>
              <path d="m43 27 5-3 5 2 2 4-4 2-5-1zm5 9 8-3 7 3 2 6-4 3-1 6-4 3-2 8-4 8-4-3-2-8-4-7 2-8-3-5 2-4z"/>
              <path d="m59 28 8-5 10 2 8 6 4 7-5 4-5-2-5 3-6-2-4-5-6-1-3-4z"/>
              <path d="m73 58 7-2 6 4-2 6-6 2-5-4z"/>
              <path d="m20 58 2 2-1 3-3-1zM62 72l2 1-1 3-2-1z"/>
            </g>
            <g class="globe-lines" clip-path="url(#globe-clip)">
              <ellipse cx="50" cy="50" rx="18" ry="44"/>
              <ellipse cx="50" cy="50" rx="34" ry="44"/>
              <ellipse cx="50" cy="50" rx="44" ry="15"/>
              <ellipse cx="50" cy="50" rx="44" ry="30"/>
              <path d="M6 50h88"/>
            </g>
            <circle class="globe-rim" cx="50" cy="50" r="44"/>
          </svg>
        </span>
      </button>
      <p id="status">Tap to talk</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
